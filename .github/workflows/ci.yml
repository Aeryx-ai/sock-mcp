name: ci
on:
  push:
    branches: [main, v1]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mcp
      # ADR 1: build against a tagged contract. Bump this tag deliberately,
      # in the same change that starts using what the new tag adds.
      - uses: actions/checkout@v4
        with:
          repository: guygrigsby/sock-contract
          ref: v0.6.10
          path: contract
          ssh-key: ${{ secrets.CONTRACT_DEPLOY_KEY }}
      # sock-client has no tags and go.mod replaces it with ../client at
      # v0.0.0, so no pin is derivable. Set the SOCK_CLIENT_REF repository
      # variable to a commit or tag to pin; unset, this builds against main.
      - uses: actions/checkout@v4
        with:
          repository: guygrigsby/sock-client
          ref: ${{ vars.SOCK_CLIENT_REF || 'main' }}
          path: client
          ssh-key: ${{ secrets.CLIENT_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: mcp/go.mod
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - run: make check
        working-directory: mcp
